<!DOCTYPE html>
<html>
<head>
    <title>One-Way Express App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: rgb(50, 243, 6);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px lightgray;
        }

        h1 {
            text-align: center;
            color: #1507e4;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: #dfff0c;
            color: black;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background: #05f1f5;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>One-Way Express App</h1>

    <label>Customer Name</label>
    <input type="text" id="customerName">

    <label>Email Address</label>
    <input type="email" id="emailAddress">

    <label>Delivery Address</label>
    <input type="text" id="address">

    <label>Delivery Area</label>
    <select id="deliveryArea">
        <option value="10">In Town ($10)</option>
        <option value="25">Oneida ($25)</option>
    </select>

    <label>Food Order Amount ($)</label>
    <input type="number" id="foodAmount" min="0">

    <button onclick="calculateTotal()">Place Order</button>

    <div id="result"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init("YOUR_PUBLIC_KEY");

function calculateTotal() {

    let name = document.getElementById("customerName").value.trim();
    let emailAddress = document.getElementById("emailAddress").value.trim();
    let address = document.getElementById("address").value.trim();

    let foodAmount =
        parseFloat(document.getElementById("foodAmount").value);

    let deliveryFee =
        parseFloat(document.getElementById("deliveryArea").value);

    if (
        !name ||
        !emailAddress ||
        !address ||
        isNaN(foodAmount)
    ) {
        document.getElementById("result").innerHTML =
            "Please fill out all fields.";
        return;
    }

    let total = foodAmount + deliveryFee;

    emailjs.send(
        "YOUR_SERVICE_ID",
        "YOUR_TEMPLATE_ID",
        {
            customer_name: name,
            customer_email: emailAddress,
            delivery_address: address,
            order_amount: foodAmount.toFixed(2),
            delivery_fee: deliveryFee.toFixed(2),
            total_cost: total.toFixed(2)
        }
    )
    .then(function() {
        console.log("Email sent successfully");
    })
    .catch(function(error) {
        console.log("Email failed:", error);
    });

    document.getElementById("result").innerHTML =
        `
        Order Confirmed!<br><br>

        Customer: ${name}<br>
        Email: ${emailAddress}<br>
        Address: ${address}<br>
        Food Amount: $${foodAmount.toFixed(2)}<br>
        Delivery Fee: $${deliveryFee.toFixed(2)}<br>
        Total Cost: $${total.toFixed(2)}<br><br>

        Confirmation email has been requested.
        `;
}
</script>

</body>
</html>
